{% extends "base.html" %}
{% block title %}Acompanhar Pedido — Cardápio Online{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Acompanhar Pedido</h1>
    <p class="text-gray-500 text-sm mb-8">Pedido <span class="text-red-500 font-semibold">{{ numero_pedido }}</span></p>

    <!-- Container para timelines (gerado via JS) -->
    <div id="timelines-container" class="space-y-6 mb-6"></div>

    <!-- Order Details -->
    <div id="order-details" class="bg-white rounded-2xl p-6 border border-gray-100 shadow-card">
        <h2 class="font-semibold text-gray-800 mb-4">Detalhes do Pedido</h2>
        <div id="order-items" class="space-y-3"></div>
        <hr class="border-gray-100 my-4">
        <div id="order-price-breakdown" class="space-y-2 text-sm mb-4"></div>
        <div class="flex justify-between items-center"><span class="text-lg font-semibold text-gray-800">Total</span><span id="order-total" class="text-2xl font-bold text-red-500"></span></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const ORDER_NUMBER = '{{ numero_pedido }}';
    const statusOrder = ['pendente', 'confirmado', 'preparando', 'pronto', 'entregue'];
    const statusLabels = { pendente: 'Pendente', confirmado: 'Confirmado', preparando: 'Preparando', pronto: 'Pronto', entregue: 'Entregue', cancelado: 'Cancelado' };
    const statusColors = { pendente: 'bg-amber-500', confirmado: 'bg-blue-500', preparando: 'bg-violet-500', pronto: 'bg-emerald-500', entregue: 'bg-emerald-600', cancelado: 'bg-red-500' };
    const statusIcons = { pendente: 'clock', confirmado: 'check', preparando: 'chef-hat', pronto: 'package-check', entregue: 'circle-check-big' };
    const statusDescriptions = {
        pendente: 'Aguardando confirmação do restaurante',
        confirmado: 'Restaurante confirmou seu pedido',
        preparando: 'Seu pedido está sendo preparado',
        pronto: 'Pedido pronto para retirada/entrega',
        entregue: 'Pedido finalizado',
    };

    function buildTimelineHTML(currentStatus, restaurantLabel) {
        const isCancelled = currentStatus === 'cancelado';
        const idx = statusOrder.indexOf(currentStatus);

        let header = '';
        if (restaurantLabel) {
            header = `<div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                <i data-lucide="store" class="w-4 h-4 text-red-500"></i>
                <span class="font-semibold text-gray-800 text-sm">${restaurantLabel}</span>
            </div>`;
        }

        let stepsHTML = '';
        if (isCancelled) {
            stepsHTML = `
                <div class="flex items-start gap-4">
                    <div class="w-10 h-10 rounded-full bg-red-500 flex items-center justify-center flex-shrink-0 shadow-sm"><i data-lucide="x" class="w-5 h-5 text-white"></i></div>
                    <div><h3 class="font-medium text-red-600">Cancelado</h3><p class="text-xs text-gray-500">Este pedido foi cancelado</p></div>
                </div>`;
        } else {
            stepsHTML = statusOrder.map((s, i) => {
                const isActive = i <= idx;
                const bgClass = isActive ? statusColors[s] : 'bg-gray-200';
                const iconColor = isActive ? 'text-white' : 'text-gray-400';
                const titleClass = isActive ? 'font-medium text-gray-800' : 'font-medium text-gray-500';
                const descClass = isActive ? 'text-xs text-gray-500' : 'text-xs text-gray-400';
                const opacity = isActive ? '' : 'opacity-40';
                return `
                    <div class="flex items-start gap-4 ${opacity}">
                        <div class="w-10 h-10 rounded-full ${bgClass} flex items-center justify-center flex-shrink-0 ${isActive ? 'shadow-sm' : ''}"><i data-lucide="${statusIcons[s]}" class="w-5 h-5 ${iconColor}"></i></div>
                        <div><h3 class="${titleClass}">${statusLabels[s]}</h3><p class="${descClass}">${statusDescriptions[s]}</p></div>
                    </div>`;
            }).join('');
        }

        return `<div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-card">
            ${header}
            <div class="space-y-6">${stepsHTML}</div>
        </div>`;
    }

    function renderTimelines(order) {
        const container = document.getElementById('timelines-container');
        const subs = order.sub_pedidos || [];

        if (subs.length > 1) {
            // Multi-restaurante: uma timeline por restaurante
            container.innerHTML = subs.map(sp =>
                buildTimelineHTML(sp.status, sp.restaurante_nome || 'Restaurante')
            ).join('');
        } else if (subs.length === 1) {
            // Single sub-pedido
            container.innerHTML = buildTimelineHTML(subs[0].status, null);
        } else {
            // Fallback legado
            container.innerHTML = buildTimelineHTML(order.status, null);
        }
        lucide.createIcons();
    }

    function renderOrderDetails(order) {
        const subs = order.sub_pedidos || [];
        let itemsHtml = '';
        let subtotal = 0;
        let taxaEntrega = 0;
        let desconto = 0;
        let codigosCupom = [];

        if (subs.length > 0) {
            subs.forEach(sp => {
                const isCancelled = sp.status === 'cancelado';
                const textColorClass = isCancelled ? 'text-gray-400 line-through' : 'text-gray-700';
                const priceColorClass = isCancelled ? 'text-gray-400 line-through' : 'text-gray-500';

                if (subs.length > 1) {
                    itemsHtml += `<p class="text-xs font-bold ${isCancelled ? 'text-gray-400' : 'text-red-500'} flex items-center gap-1 mt-2 first:mt-0"><i data-lucide="store" class="w-3 h-3"></i> ${sp.restaurante_nome || 'Restaurante'} ${isCancelled ? '(Cancelado)' : ''}</p>`;
                }
                sp.itens.forEach(i => {
                    itemsHtml += `<div class="flex justify-between text-sm"><span class="${textColorClass}">${i.quantidade}x ${i.nome}</span><span class="${priceColorClass}">${formatMoney(i.subtotal)}</span></div>`;
                });
                
                if (!isCancelled) {
                    // Acumular valores apenas de sub-pedidos não cancelados
                    sp.itens.forEach(i => { subtotal += parseFloat(i.subtotal || 0); });
                    taxaEntrega += parseFloat(sp.taxa_entrega || 0);
                    desconto += parseFloat(sp.valor_desconto || 0);
                    if (sp.codigo_cupom) codigosCupom.push(sp.codigo_cupom);
                }
            });
        } else {
            const isCancelled = order.status === 'cancelado';
            const textColorClass = isCancelled ? 'text-gray-400 line-through' : 'text-gray-700';
            const priceColorClass = isCancelled ? 'text-gray-400 line-through' : 'text-gray-500';

            (order.itens || []).forEach(i => {
                itemsHtml += `<div class="flex justify-between text-sm"><span class="${textColorClass}">${i.quantidade}x ${i.nome}</span><span class="${priceColorClass}">${formatMoney(i.subtotal)}</span></div>`;
                if (!isCancelled) {
                    subtotal += parseFloat(i.subtotal || 0);
                }
            });
            if (!isCancelled) {
                taxaEntrega = parseFloat(order.taxa_entrega || 0);
                desconto = parseFloat(order.valor_desconto || 0);
                if (order.codigo_cupom) codigosCupom.push(order.codigo_cupom);
            }
        }

        document.getElementById('order-items').innerHTML = itemsHtml;

        // Montar breakdown de preços
        let breakdownHtml = `
            <div class="flex justify-between text-gray-500">
                <span>Subtotal</span>
                <span>${formatMoney(subtotal)}</span>
            </div>
            <div class="flex justify-between text-gray-500">
                <span>Taxa de entrega</span>
                <span>${taxaEntrega > 0 ? formatMoney(taxaEntrega) : 'Grátis'}</span>
            </div>`;

        if (desconto > 0) {
            const cupomLabel = codigosCupom.length > 0 ? ` (${[...new Set(codigosCupom)].join(', ')})` : '';
            breakdownHtml += `
            <div class="flex justify-between text-emerald-500">
                <span>Desconto${cupomLabel}</span>
                <span>- ${formatMoney(desconto)}</span>
            </div>`;
        }

        const finalTotal = Math.max(0, subtotal + taxaEntrega - desconto);

        document.getElementById('order-price-breakdown').innerHTML = breakdownHtml;
        document.getElementById('order-total').textContent = formatMoney(finalTotal);
        lucide.createIcons();
    }

    async function loadOrder() {
        try {
            const res = await API.get(`/api/orders/`);
            const data = await res.json();
            const order = data.results?.find(o => o.numero_pedido === ORDER_NUMBER);
            if (!order) return;

            renderTimelines(order);
            renderOrderDetails(order);

            // WebSocket para atualizações em tempo real
            if (order.status !== 'entregue' && order.status !== 'cancelado') {
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                const token = Auth.getToken();
                const ws = new WebSocket(`${protocol}//${location.host}/ws/orders/${order.id}/status/?token=${token}`);
                ws.onmessage = (e) => {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'status_update') {
                        renderTimelines(msg.data);
                        renderOrderDetails(msg.data);
                        showToast(`Pedido atualizado: ${statusLabels[msg.data.status] || msg.data.status}`);
                    }
                };
            }
        } catch {}
    }
    loadOrder();
</script>
{% endblock %}
